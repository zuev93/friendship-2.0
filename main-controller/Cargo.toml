[package]
name = "druzhba-main-controller"
version = "0.1.0"
authors = ["Zuev"]
edition = "2021"

[dependencies]
# Common crate with shared drivers
druzhba-common = { path = "../common" }
druzhba-macros = { path = "../common/macros" }

# Embassy async runtime
embassy-executor = { workspace = true }
embassy-time = { workspace = true }
embassy-sync = { workspace = true }
embassy-futures = { workspace = true }
embassy-usb = { workspace = true }
embassy-stm32 = { version = "0.5", features = [
    "stm32h563vi",
    "memory-x",
    "time-driver-any",
    "exti",
    "unstable-pac",
] }

# HAL traits
embedded-hal = { workspace = true }
embedded-hal-async = { workspace = true }
embedded-hal-bus = { workspace = true }

# Core
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }

# Panic handler
panic-halt = { workspace = true }

# Utilities
ufmt = { workspace = true }
heapless = { workspace = true }
static_cell = { workspace = true }

# USB PD 3.1 EPR sink negotiation
usbpd = { version = "2", default-features = false }
usbpd-traits = { version = "2", default-features = false }

[[bin]]
name = "druzhba-main-controller"
path = "src/main.rs"

[lints.rust]
warnings = "deny"

